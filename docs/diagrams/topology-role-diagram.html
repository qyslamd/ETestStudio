<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>拓扑的桥梁角色</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #f5f5f5;
    font-family: 'Geist', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
    color: #2d3142;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 3rem 2rem;
    min-height: 100vh;
  }
  .header {
    text-align: center;
    margin-bottom: 2rem;
    max-width: 760px;
  }
  .eyebrow {
    font-family: 'Geist Mono', monospace;
    font-size: 8px;
    font-weight: 500;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: #7a8399;
    margin-bottom: 0.5rem;
  }
  h1 {
    font-family: 'Instrument Serif', serif;
    font-size: 1.75rem;
    font-weight: 400;
    color: #2d3142;
    margin-bottom: 0.5rem;
  }
  .subtitle {
    font-family: 'Geist', 'PingFang SC', sans-serif;
    font-size: 13px;
    color: #4f5d75;
    line-height: 1.6;
  }
  .diagram-wrap {
    width: 100%;
    max-width: 880px;
  }
  svg { width: 100%; height: auto; display: block; }
</style>
</head>
<body>

<div class="header">
  <p class="eyebrow">ARCHITECTURE / 拓扑角色</p>
  <h1>拓扑：信号路由与数据解释的桥梁</h1>
  <p class="subtitle">拓扑内部 UUT 端口与设备端口通过 connection 连接，端口上绑定 ICD 帧（数据解释），设备通过 pluginId 关联硬件插件（信号路由），测试程序通过 UUID 间接引用</p>
</div>

<div class="diagram-wrap">
<svg viewBox="0 0 880 460" xmlns="http://www.w3.org/2000/svg">

  <!-- Background -->
  <rect width="880" height="460" fill="#f5f5f5"/>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
    </marker>
    <marker id="arrow-soft" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#7a8399"/>
    </marker>
    <marker id="arrow-mute" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
    </marker>
  </defs>

  <!-- ============ ZONE: 拓扑 ============ -->
  <rect x="220" y="108" width="440" height="252" rx="8"
        fill="rgba(235,108,54,0.04)" stroke="rgba(235,108,54,0.25)" stroke-width="1" stroke-dasharray="0"/>
  <!-- Zone label mask + text -->
  <rect x="372" y="100" width="96" height="16" rx="2" fill="#f5f5f5"/>
  <text x="420" y="111" fill="#eb6c36" font-size="8" font-family="'Geist Mono','PingFang SC',monospace"
        text-anchor="middle" letter-spacing="0.14em">拓扑 .etopo</text>

  <!-- ============ ARROWS (drawn before inner nodes) ============ -->

  <!-- 1. ICD -> UUT (端口绑帧): horizontal at y=236, passes through zone left boundary -->
  <line x1="164" y1="236" x2="244" y2="236" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="176" y="220" width="56" height="12" rx="2" fill="#f5f5f5"/>
  <text x="204" y="229" fill="#7a8399" font-size="8" font-family="'Geist Mono','PingFang SC',monospace"
        text-anchor="middle" letter-spacing="0.06em">端口绑帧</text>

  <!-- 2. 设备 -> 硬件插件 (pluginId): horizontal at y=236, passes through zone right boundary -->
  <line x1="636" y1="236" x2="712" y2="236" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="652" y="220" width="44" height="12" rx="2" fill="#f5f5f5"/>
  <text x="674" y="229" fill="#7a8399" font-size="8" font-family="'Geist Mono','PingFang SC',monospace"
        text-anchor="middle" letter-spacing="0.06em">pluginId</text>

  <!-- 3. 测试程序 -> Zone (UUID): vertical, dashed (indirect) -->
  <line x1="440" y1="92" x2="440" y2="104" stroke="#7a8399" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-soft)"/>
  <rect x="452" y="86" width="36" height="12" rx="2" fill="#f5f5f5"/>
  <text x="470" y="95" fill="#7a8399" font-size="8" font-family="'Geist Mono','PingFang SC',monospace"
        text-anchor="middle" letter-spacing="0.06em">UUID</text>

  <!-- 4. UUT <-> 设备 (connection): horizontal inside zone at y=236 -->
  <line x1="412" y1="236" x2="468" y2="236" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-mute)"/>
  <line x1="468" y1="236" x2="412" y2="236" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-mute)" transform="translate(0,0)"/>
  <!-- Use a simpler bidirectional line -->
  <line x1="412" y1="236" x2="468" y2="236" stroke="#eb6c36" stroke-width="1.2"/>
  <rect x="420" y="220" width="40" height="12" rx="2" fill="#f5f5f5"/>
  <text x="440" y="229" fill="#eb6c36" font-size="8" font-family="'Geist Mono','PingFang SC',monospace"
        text-anchor="middle" letter-spacing="0.06em">connection</text>
  <!-- small dots at both ends to show bidirectional -->
  <circle cx="412" cy="236" r="2.5" fill="#eb6c36"/>
  <circle cx="468" cy="236" r="2.5" fill="#eb6c36"/>

  <!-- ============ NODES ============ -->

  <!-- ICD Protocol (store) -->
  <rect x="24" y="196" width="140" height="80" rx="6" fill="#f5f5f5"/>
  <rect x="24" y="196" width="140" height="80" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
  <rect x="32" y="202" width="28" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
  <text x="46" y="211" fill="rgba(79,93,117,0.80)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">ICD</text>
  <text x="94" y="240" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','PingFang SC',sans-serif" text-anchor="middle">ICD 协议</text>
  <text x="94" y="256" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">帧A · 帧B · 帧C</text>

  <!-- UUT (inside zone, left) -->
  <rect x="248" y="176" width="164" height="120" rx="6" fill="#f5f5f5"/>
  <rect x="248" y="176" width="164" height="120" rx="6" fill="rgba(79,93,117,0.08)" stroke="#7a8399" stroke-width="1"/>
  <rect x="256" y="182" width="28" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
  <text x="270" y="191" fill="rgba(122,131,153,0.80)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">UUT</text>
  <text x="330" y="214" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','PingFang SC',sans-serif" text-anchor="middle">飞控</text>
  <!-- Port box -->
  <rect x="268" y="226" width="124" height="28" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.15)" stroke-width="0.8"/>
  <circle cx="280" cy="240" r="3" fill="#eb6c36"/>
  <text x="292" y="243" fill="#2d3142" font-size="10" font-weight="500" font-family="'Geist','PingFang SC',sans-serif">COM1</text>
  <text x="348" y="243" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace">帧A</text>
  <text x="330" y="272" fill="#7a8399" font-size="8" font-family="'Geist','PingFang SC',sans-serif" text-anchor="middle">端口绑定 ICD 帧</text>

  <!-- 设备 (inside zone, right) -->
  <rect x="468" y="176" width="164" height="120" rx="6" fill="#f5f5f5"/>
  <rect x="468" y="176" width="164" height="120" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <rect x="476" y="182" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
  <text x="492" y="191" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">DEV</text>
  <text x="550" y="214" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','PingFang SC',sans-serif" text-anchor="middle">CAN 卡</text>
  <!-- Port box -->
  <rect x="488" y="226" width="124" height="28" rx="4" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.15)" stroke-width="0.8"/>
  <circle cx="500" cy="240" r="3" fill="#eb6c36"/>
  <text x="512" y="243" fill="#2d3142" font-size="10" font-weight="500" font-family="'Geist','PingFang SC',sans-serif">ch1</text>
  <text x="568" y="243" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace">帧A</text>
  <text x="550" y="272" fill="#7a8399" font-size="8" font-family="'Geist','PingFang SC',sans-serif" text-anchor="middle">pluginId → 硬件插件</text>

  <!-- 硬件插件 (backend) -->
  <rect x="716" y="196" width="140" height="80" rx="6" fill="#f5f5f5"/>
  <rect x="716" y="196" width="140" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <rect x="724" y="202" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
  <text x="738" y="211" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">HW</text>
  <text x="786" y="240" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','PingFang SC',sans-serif" text-anchor="middle">硬件插件</text>
  <text x="786" y="256" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">mock_can / can_pxi</text>

  <!-- 测试程序 (input) -->
  <rect x="360" y="28" width="160" height="64" rx="6" fill="#f5f5f5"/>
  <rect x="360" y="28" width="160" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
  <rect x="368" y="34" width="36" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
  <text x="386" y="43" fill="rgba(122,131,153,0.80)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">PROG</text>
  <text x="440" y="66" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','PingFang SC',sans-serif" text-anchor="middle">测试程序</text>
  <text x="440" y="82" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">.tcase · UUID</text>

  <!-- ============ ANNOTATION ============ -->
  <text x="440" y="316" fill="rgba(45,49,66,0.35)" font-size="11" font-family="'Instrument Serif',serif" font-style="italic" text-anchor="middle">端口是绑定的锚点 — 绑帧（ICD）、连线（UUT↔设备）、引插件（pluginId）</text>

  <!-- ============ LEGEND ============ -->
  <line x1="24" y1="384" x2="856" y2="384" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
  <text x="24" y="404" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">LEGEND</text>

  <rect x="92" y="396" width="12" height="12" rx="2" fill="rgba(235,108,54,0.04)" stroke="rgba(235,108,54,0.25)" stroke-width="1"/>
  <text x="112" y="405" fill="#7a8399" font-size="8" font-family="'Geist','PingFang SC',sans-serif">拓扑边界</text>

  <rect x="192" y="396" width="12" height="12" rx="2" fill="rgba(79,93,117,0.08)" stroke="#7a8399" stroke-width="1"/>
  <text x="212" y="405" fill="#7a8399" font-size="8" font-family="'Geist','PingFang SC',sans-serif">UUT</text>

  <rect x="268" y="396" width="12" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="288" y="405" fill="#7a8399" font-size="8" font-family="'Geist','PingFang SC',sans-serif">设备/插件</text>

  <rect x="372" y="396" width="12" height="12" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
  <text x="392" y="405" fill="#7a8399" font-size="8" font-family="'Geist','PingFang SC',sans-serif">协议/配置</text>

  <line x1="472" y1="402" x2="496" y2="402" stroke="#eb6c36" stroke-width="1.2"/>
  <circle cx="472" cy="402" r="2.5" fill="#eb6c36"/>
  <circle cx="496" cy="402" r="2.5" fill="#eb6c36"/>
  <text x="506" y="405" fill="#7a8399" font-size="8" font-family="'Geist','PingFang SC',sans-serif">connection</text>

  <line x1="596" y1="402" x2="620" y2="402" stroke="#7a8399" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="628" y="405" fill="#7a8399" font-size="8" font-family="'Geist','PingFang SC',sans-serif">间接引用</text>

  <circle cx="712" cy="402" r="3" fill="#eb6c36"/>
  <text x="724" y="405" fill="#7a8399" font-size="8" font-family="'Geist','PingFang SC',sans-serif">端口</text>

</svg>
</div>

</body>
</html>
