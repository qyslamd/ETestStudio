<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#4fc3f7" flood-opacity="0.3"/>
    </filter>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2d2d2d" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#1e1e1e" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="docGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#81d4fa"/>
      <stop offset="50%" stop-color="#4fc3f7"/>
      <stop offset="100%" stop-color="#29b6f6"/>
    </linearGradient>
    <linearGradient id="plusGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e1f5fe"/>
    </linearGradient>
  </defs>
  <!-- Card background -->
  <rect x="1" y="1" width="22" height="22" rx="5" fill="url(#cardBg)" filter="url(#shadow)" stroke="#3c3c3c" stroke-width="0.5"/>
  <!-- Isometric document page -->
  <g transform="translate(5, 4) skewY(-6) skewX(3)">
    <rect x="0" y="0" width="14" height="16" rx="2" fill="url(#docGrad)" opacity="0.95"/>
    <rect x="3" y="3.5" width="8" height="1" rx="0.5" fill="#ffffff" opacity="0.6"/>
    <rect x="3" y="6.5" width="6" height="1" rx="0.5" fill="#ffffff" opacity="0.6"/>
    <rect x="3" y="9.5" width="7" height="1" rx="0.5" fill="#ffffff" opacity="0.6"/>
  </g>
  <!-- + badge -->
  <circle cx="17" cy="6" r="4.5" fill="#1e1e1e" stroke="#4fc3f7" stroke-width="1.2"/>
  <path d="M17 4v4M15 6h4" stroke="#4fc3f7" stroke-width="1.5" stroke-linecap="round"/>
</svg>