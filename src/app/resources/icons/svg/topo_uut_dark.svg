<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 24 24" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="24" y2="24">
      <stop offset="0%" stop-color="#F0F4FF"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="12" y2="12">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0" y1="0" x2="12" y2="12">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#0891B2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>
  <!-- 圆角白底 -->
  <rect x="1" y="1" width="22" height="22" rx="5" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="22" height="22" rx="5" stroke="#E2E8F0" stroke-width="0.5"/>
  <!-- UUT 靶心符号 -->
  <circle cx="12" cy="12" r="7" stroke="url(#blueGrad)" stroke-width="2" fill="none" filter="url(#shadow)"/>
  <circle cx="12" cy="12" r="4" fill="url(#cyanGrad)" filter="url(#shadow)"/>
  <circle cx="11.5" cy="11.5" r="1.5" fill="#FFFFFF" fill-opacity="0.4"/>
  <circle cx="12" cy="12" r="1.5" fill="#FFFFFF"/>
</svg>
