<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 24 24" fill="none">
  <defs>
    <!-- 暗色背景渐变 -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="24" y2="24">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <!-- 蓝色节点渐变 -->
    <linearGradient id="blueGrad" x1="0" y1="0" x2="12" y2="12">
      <stop offset="0%" stop-color="#93C5FD"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <!-- 红色节点渐变 -->
    <linearGradient id="redGrad" x1="0" y1="0" x2="12" y2="12">
      <stop offset="0%" stop-color="#FDA4AF"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>
    <!-- 黄色节点渐变 -->
    <linearGradient id="yellowGrad" x1="0" y1="0" x2="12" y2="12">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <!-- 绿色节点渐变 -->
    <linearGradient id="greenGrad" x1="0" y1="0" x2="12" y2="12">
      <stop offset="0%" stop-color="#BBF7D0"/>
      <stop offset="100%" stop-color="#22C55E"/>
    </linearGradient>
    <!-- 连接线渐变 -->
    <linearGradient id="lineGrad" x1="0" y1="0" x2="24" y2="24">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#A78BFA" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#FCA5A5" stop-opacity="0.7"/>
    </linearGradient>
    <!-- 发光阴影 -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="3.5" flood-color="#60A5FA" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- 暗色毛玻璃圆角底 -->
  <rect x="1" y="1" width="22" height="22" rx="5" fill="url(#bgGrad)" fill-opacity="0.85"/>
  <rect x="1" y="1" width="22" height="22" rx="5" stroke="#334155" stroke-width="0.5"/>

  <!-- 网络连接线 -->
  <line x1="12" y1="5" x2="5" y2="14" stroke="#A78BFA" stroke-width="1.5" stroke-opacity="0.5" stroke-linecap="round"/>
  <line x1="5" y1="14" x2="17" y2="17" stroke="#60A5FA" stroke-width="1.5" stroke-opacity="0.5" stroke-linecap="round"/>
  <line x1="12" y1="5" x2="17" y2="17" stroke="#FB7185" stroke-width="1.5" stroke-opacity="0.4" stroke-linecap="round"/>
  <line x1="12" y1="5" x2="7" y2="19" stroke="#86EFAC" stroke-width="1.2" stroke-opacity="0.35" stroke-linecap="round"/>
  <line x1="5" y1="14" x2="19" y2="11" stroke="#FCD34D" stroke-width="1.2" stroke-opacity="0.35" stroke-linecap="round"/>

  <!-- 节点 -->
  <circle cx="12" cy="5" r="3" fill="url(#blueGrad)" filter="url(#shadow)"/>
  <circle cx="11.5" cy="4.5" r="1" fill="#FFFFFF" fill-opacity="0.25"/>

  <circle cx="5" cy="14" r="3" fill="url(#redGrad)" filter="url(#shadow)"/>
  <circle cx="4.5" cy="13.5" r="1" fill="#FFFFFF" fill-opacity="0.25"/>

  <circle cx="17" cy="17" r="3" fill="url(#yellowGrad)" filter="url(#shadow)"/>
  <circle cx="16.5" cy="16.5" r="1" fill="#FFFFFF" fill-opacity="0.25"/>

  <circle cx="7" cy="19" r="2.2" fill="url(#greenGrad)" filter="url(#shadow)"/>
  <circle cx="6.6" cy="18.6" r="0.8" fill="#FFFFFF" fill-opacity="0.25"/>

  <circle cx="19" cy="11" r="2" fill="url(#lineGrad)" filter="url(#shadow)"/>
  <circle cx="18.6" cy="10.6" r="0.7" fill="#FFFFFF" fill-opacity="0.25"/>
</svg>
