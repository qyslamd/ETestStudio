<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 24 24" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="24" y2="24">
      <stop offset="0%" stop-color="#FFF7ED"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0" y1="0" x2="12" y2="12">
      <stop offset="0%" stop-color="#FB7185"/>
      <stop offset="100%" stop-color="#DC2626"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0" y1="0" x2="12" y2="12">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="0" y1="0" x2="20" y2="0">
      <stop offset="0%" stop-color="#FCA5A5" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FCA5A5" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#F87171" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect x="1" y="1" width="22" height="22" rx="5" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="22" height="22" rx="5" stroke="#E2E8F0" stroke-width="0.5"/>
  <!-- 芯片主体（等轴测感） -->
  <rect x="6" y="7" width="12" height="10" rx="2.5" fill="url(#redGrad)" filter="url(#shadow)"/>
  <rect x="6.5" y="7.5" width="11" height="9" rx="2" fill="none" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="0.5"/>
  <!-- 芯片内小正方形 -->
  <rect x="9" y="9.5" width="6" height="5" rx="1" fill="url(#orangeGrad)"/>
  <rect x="8.5" y="9" width="1.5" height="6" rx="0.4" fill="#FFFFFF" fill-opacity="0.3"/>
  <!-- 信号波纹 -->
  <path d="M3 14 Q5 11 7 14" stroke="#F87171" stroke-width="1" stroke-linecap="round" fill="none" stroke-opacity="0.6"/>
  <path d="M2 16 Q5 12 8 16" stroke="#FCA5A5" stroke-width="0.8" stroke-linecap="round" fill="none" stroke-opacity="0.4"/>
  <path d="M17 14 Q19 11 21 14" stroke="#F87171" stroke-width="1" stroke-linecap="round" fill="none" stroke-opacity="0.6"/>
  <path d="M16 16 Q19 12 22 16" stroke="#FCA5A5" stroke-width="0.8" stroke-linecap="round" fill="none" stroke-opacity="0.4"/>
  <!-- 芯片引脚 -->
  <rect x="10" y="6" width="1.5" height="1.5" rx="0.3" fill="#FB7185"/>
  <rect x="12.5" y="6" width="1.5" height="1.5" rx="0.3" fill="#FB7185"/>
  <rect x="10" y="16.5" width="1.5" height="1.5" rx="0.3" fill="#FB7185"/>
  <rect x="12.5" y="16.5" width="1.5" height="1.5" rx="0.3" fill="#FB7185"/>
</svg>
