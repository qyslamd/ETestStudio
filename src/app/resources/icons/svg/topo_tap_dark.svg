<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 24 24">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="24" y2="24">
      <stop offset="0%" stop-color="#BA68C8"/>
      <stop offset="100%" stop-color="#6A1B9A"/>
    </linearGradient>
  </defs>
  <!-- Horizontal connection line with tap point -->
  <path fill="none" stroke="url(#g)" stroke-width="2" d="M2 12h12"/>
  <!-- Tap point (diamond) -->
  <polygon fill="url(#g)" points="14,12 17,9 20,12 17,15"/>
  <!-- Vertical dotted line to monitor -->
  <path fill="none" stroke="url(#g)" stroke-width="1.5" stroke-dasharray="2,2" d="M17,12 L17,20"/>
  <!-- Monitor block at bottom -->
  <rect x="12" y="17" width="10" height="6" rx="2" fill="url(#g)" opacity="0.6"/>
</svg>
