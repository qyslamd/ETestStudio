<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 24 24">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="24" y2="24">
      <stop offset="0%" stop-color="#EF5350"/>
      <stop offset="50%" stop-color="#FF7043"/>
      <stop offset="100%" stop-color="#FFA726"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="12" y2="12">
      <stop offset="0%" stop-color="#66BB6A"/>
      <stop offset="100%" stop-color="#26A69A"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0.5" dy="1" stdDeviation="0.8" flood-color="#bf360c" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- 断开的无效连线 -->
  <path d="M2 6 Q8 10 10 8" stroke="url(#g1)" stroke-width="1.8" fill="none" stroke-linecap="round" opacity="0.7" filter="url(#shadow)"/>
  <path d="M14 8 Q16 10 22 6" stroke="url(#g1)" stroke-width="1.8" fill="none" stroke-linecap="round" opacity="0.7" filter="url(#shadow)"/>
  <!-- 断裂处 X 标记 -->
  <path d="M9.5 7.5l-1.5 1.5" stroke="#EF5350" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M9.5 9l-1.5-1.5" stroke="#EF5350" stroke-width="1.5" stroke-linecap="round"/>
  <!-- 有效的连线 + 对勾 -->
  <path d="M2 18 Q9 14 14 16 Q19 18 22 15" stroke="url(#g2)" stroke-width="1.8" fill="none" stroke-linecap="round" filter="url(#shadow)"/>
  <path d="M16.5 14.5l1.5 1.5 3-3" stroke="#66BB6A" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow)"/>
</svg>
