<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#4fc3f7" flood-opacity="0.2"/>
    </filter>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#f8f9fa" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="parentGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#81d4fa"/>
      <stop offset="50%" stop-color="#4fc3f7"/>
      <stop offset="100%" stop-color="#29b6f6"/>
    </linearGradient>
    <linearGradient id="childGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a5d6a7"/>
      <stop offset="50%" stop-color="#66bb6a"/>
      <stop offset="100%" stop-color="#43a047"/>
    </linearGradient>
    <linearGradient id="plusGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e1f5fe"/>
    </linearGradient>
  </defs>
  <!-- Card background -->
  <rect x="1" y="1" width="22" height="22" rx="5" fill="url(#cardBg)" filter="url(#shadow)" stroke="#e0e0e0" stroke-width="0.5"/>
  <!-- Tree hierarchy icon: parent + two children -->
  <g transform="translate(6, 5)">
    <!-- Parent node -->
    <rect x="3" y="0" width="8" height="2.5" rx="1.2" fill="url(#parentGrad)" opacity="0.95"/>
    <!-- Connection lines -->
    <line x1="7" y1="2.5" x2="7" y2="4.5" stroke="#4fc3f7" stroke-width="0.8" opacity="0.7"/>
    <line x1="3.5" y1="4.5" x2="10.5" y2="4.5" stroke="#4fc3f7" stroke-width="0.8" opacity="0.7"/>
    <line x1="3.5" y1="4.5" x2="3.5" y2="5.5" stroke="#66bb6a" stroke-width="0.8" opacity="0.7"/>
    <line x1="10.5" y1="4.5" x2="10.5" y2="5.5" stroke="#66bb6a" stroke-width="0.8" opacity="0.7"/>
    <!-- Child nodes -->
    <rect x="1.5" y="5.5" width="4" height="2.5" rx="1.2" fill="url(#childGrad)" opacity="0.9"/>
    <rect x="8.5" y="5.5" width="4" height="2.5" rx="1.2" fill="url(#childGrad)" opacity="0.9"/>
    <!-- New child hint dot -->
    <circle cx="14" cy="9.5" r="1.2" fill="#66bb6a" opacity="0.5"/>
    <path d="M13.2 9.5h1.6M14 8.7v1.6" stroke="#66bb6a" stroke-width="0.7" stroke-linecap="round"/>
  </g>
  <!-- + badge (blue) -->
  <circle cx="17" cy="6" r="4.5" fill="#ffffff" stroke="#4fc3f7" stroke-width="1.2"/>
  <path d="M17 4v4M15 6h4" stroke="#4fc3f7" stroke-width="1.5" stroke-linecap="round"/>
</svg>
