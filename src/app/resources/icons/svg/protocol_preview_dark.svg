<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#66bb6a" flood-opacity="0.2"/>
    </filter>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#f8f9fa" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="eyeGlass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#81c784"/>
      <stop offset="50%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#388e3c"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#66bb6a"/>
      <stop offset="50%" stop-color="#4fc3f7"/>
      <stop offset="100%" stop-color="#29b6f6"/>
    </linearGradient>
  </defs>
  <!-- Card background -->
  <rect x="1" y="1" width="22" height="22" rx="5" fill="url(#cardBg)" filter="url(#shadow)" stroke="#e0e0e0" stroke-width="0.5"/>
  <!-- Isometric magnifying glass -->
  <g transform="translate(2, 1) skewY(-6) skewX(3)">
    <circle cx="10" cy="8" r="5.5" fill="none" stroke="url(#eyeGlass)" stroke-width="1.5" opacity="0.9"/>
    <circle cx="10" cy="8" r="2" fill="url(#eyeGlass)" opacity="0.5"/>
    <line x1="14" y1="12" x2="17.5" y2="15.5" stroke="url(#eyeGlass)" stroke-width="1.8" stroke-linecap="round" opacity="0.9"/>
  </g>
  <!-- Signal wave at bottom showing payload -->
  <g transform="translate(4, 14)" opacity="0.7">
    <polyline points="0,4 2,0 4,6 6,2 8,5 10,1 12,4 14,3" fill="none" stroke="url(#waveGrad)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- Eye badge (green) -->
  <circle cx="18" cy="5" r="4.5" fill="#ffffff" stroke="#66bb6a" stroke-width="1.2"/>
  <path d="M15 5a3 3 0 016 0 3 3 0 01-6 0z" fill="none" stroke="#66bb6a" stroke-width="1" opacity="0.8"/>
  <circle cx="18" cy="5" r="1" fill="#66bb6a" opacity="0.6"/>
</svg>
