<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#4fc3f7" flood-opacity="0.2"/>
    </filter>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#f8f9fa" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="accGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#81d4fa"/>
      <stop offset="100%" stop-color="#29b6f6"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="22" height="22" rx="5" fill="url(#cardBg)" filter="url(#shadow)" stroke="#e0e0e0" stroke-width="0.5"/>
  <rect x="4" y="4.5" width="6.5" height="4" rx="1.5" fill="url(#accGrad)" opacity="0.95"/>
  <rect x="11" y="4.5" width="6.5" height="4" rx="1.5" fill="url(#accGrad)" opacity="0.5"/>
  <rect x="4" y="9.5" width="16" height="10.5" rx="1.5" fill="none" stroke="url(#accGrad)" stroke-width="1.2"/>
  <line x1="7" y1="13" x2="17" y2="13" stroke="url(#accGrad)" stroke-width="1" opacity="0.45" stroke-linecap="round"/>
  <line x1="7" y1="16" x2="14" y2="16" stroke="url(#accGrad)" stroke-width="1" opacity="0.45" stroke-linecap="round"/>
</svg>
