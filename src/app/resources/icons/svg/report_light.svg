<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <defs>
    <linearGradient id="cardGrad" x1="10" y1="7" x2="38" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0f0f0"/>
    </linearGradient>
    <linearGradient id="hdrGrad" x1="10" y1="7" x2="38" y2="17" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4285F4"/>
      <stop offset="35%" stop-color="#EA4335"/>
      <stop offset="70%" stop-color="#FBBC04"/>
      <stop offset="100%" stop-color="#34A853"/>
    </linearGradient>
    <linearGradient id="frost" x1="0" y1="7" x2="0" y2="17">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.06"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.22"/>
    </filter>
  </defs>

  <g transform="translate(24,24) skewY(-3) translate(-24,-24)">
    <!-- Card -->
    <rect x="10" y="7" width="28" height="35" rx="5" fill="url(#cardGrad)" filter="url(#softShadow)"/>

    <!-- Colorful gradient header -->
    <path d="M10 12 Q10 7 15 7 L33 7 Q38 7 38 12 L38 17 L10 17 Z" fill="url(#hdrGrad)"/>
    <path d="M10 12 Q10 7 15 7 L33 7 Q38 7 38 12 L38 17 L10 17 Z" fill="url(#frost)"/>

    <!-- Header title lines -->
    <rect x="14" y="10.5" width="10" height="2" rx="1" fill="rgba(255,255,255,0.80)"/>
    <rect x="30" y="10.5" width="4" height="2" rx="1" fill="rgba(255,255,255,0.50)"/>

    <!-- Bar chart -->
    <rect x="14" y="33" width="4" height="5" rx="1" fill="#4285F4" opacity="0.88"/>
    <rect x="20" y="29" width="4" height="9" rx="1" fill="#EA4335" opacity="0.88"/>
    <rect x="26" y="25" width="4" height="13" rx="1" fill="#FBBC04" opacity="0.88"/>
    <rect x="32" y="30" width="4" height="8" rx="1" fill="#34A853" opacity="0.88"/>

    <!-- Trend line -->
    <path d="M16 32 L22 28 L28 24 L34 29" stroke="rgba(66,133,244,0.35)" stroke-width="1.2" fill="none" stroke-linecap="round" stroke-dasharray="2 1.5"/>

    <!-- Data dots -->
    <circle cx="16" cy="32" r="1.3" fill="#4285F4"/>
    <circle cx="22" cy="28" r="1.3" fill="#EA4335"/>
    <circle cx="28" cy="24" r="1.3" fill="#FBBC04"/>
    <circle cx="34" cy="29" r="1.3" fill="#34A853"/>

    <!-- Baseline -->
    <rect x="13" y="38.5" width="22" height="1.2" rx="0.6" fill="#e0e0e0"/>
  </g>
</svg>
