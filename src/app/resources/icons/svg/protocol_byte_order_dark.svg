      <stop offset="0%" stop-color="#ffd54f"/>
      <stop offset="40%" stop-color="#ffb300"/>
      <stop offset="100%" stop-color="#f57f17"/>
    </linearGradient>
    <linearGradient id="byteGrad" x1="0" y1="0" x2="0" y2="1">
