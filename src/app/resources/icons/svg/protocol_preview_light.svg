<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="3.5 0 19.5 19">
  <defs>
    <linearGradient id="eyeGlass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#66bb6a"/>
      <stop offset="50%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="50%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
  </defs>
  <!-- Isometric magnifying glass -->
  <g transform="translate(2, 1) skewY(-6) skewX(3)">
    <circle cx="10" cy="8" r="5.5" fill="none" stroke="url(#eyeGlass)" stroke-width="1.5" opacity="0.85"/>
    <circle cx="10" cy="8" r="2" fill="url(#eyeGlass)" opacity="0.45"/>
    <line x1="14" y1="12" x2="17.5" y2="15.5" stroke="url(#eyeGlass)" stroke-width="1.8" stroke-linecap="round" opacity="0.85"/>
  </g>
  <!-- Signal wave at bottom -->
  <g transform="translate(4, 14)" opacity="0.6">
    <polyline points="0,4 2,0 4,6 6,2 8,5 10,1 12,4 14,3" fill="none" stroke="url(#waveGrad)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- Eye badge (green) -->
  <circle cx="18" cy="5" r="4.5" fill="#ffffff" stroke="#4caf50" stroke-width="1.2"/>
  <path d="M15 5a3 3 0 016 0 3 3 0 01-6 0z" fill="none" stroke="#4caf50" stroke-width="1" opacity="0.75"/>
  <circle cx="18" cy="5" r="1" fill="#4caf50" opacity="0.55"/>
</svg>
