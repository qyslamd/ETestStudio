<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="24" y2="24">
      <stop offset="0%" stop-color="#448AFF"/>
      <stop offset="100%" stop-color="#2962FF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#2962FF" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Frosted glass badge -->
  <rect x="1" y="1" width="22" height="22" rx="6" ry="6"
        fill="url(#bg)" filter="url(#shadow)" opacity="0.92"/>
  <rect x="1" y="1" width="22" height="22" rx="6" ry="6"
        fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="0.5"/>
  <!-- Docked window (left, faded) -->
  <rect x="4" y="5" width="9" height="7" rx="1.5" ry="1.5"
        fill="none" stroke="#FFFFFF" stroke-width="1.3" opacity="0.5"/>
  <!-- Floating window (right, offset, brighter) -->
  <rect x="10" y="4" width="9" height="7" rx="1.5" ry="1.5"
        fill="none" stroke="#FFFFFF" stroke-width="1.8"/>
  <rect x="10" y="4" width="9" height="2.5" rx="1.5" ry="1.5"
        fill="#FFFFFF" opacity="0.3"/>
</svg>
