<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#4dd0e1" flood-opacity="0.3"/>
    </filter>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2d2d2d" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#1e1e1e" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="sliderGrad1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4dd0e1"/>
      <stop offset="100%" stop-color="#26c6da"/>
    </linearGradient>
    <linearGradient id="sliderGrad2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#80deea"/>
      <stop offset="100%" stop-color="#4dd0e1"/>
    </linearGradient>
    <linearGradient id="sliderGrad3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b2ebf2"/>
      <stop offset="100%" stop-color="#80deea"/>
    </linearGradient>
    <linearGradient id="knobGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1e1e"/>
      <stop offset="100%" stop-color="#2d2d2d"/>
    </linearGradient>
  </defs>
  <!-- Card -->
  <rect x="1" y="1" width="22" height="22" rx="5" fill="url(#cardBg)" filter="url(#shadow)" stroke="#3c3c3c" stroke-width="0.5"/>
  <!-- Sliders -->
  <g transform="translate(1, 1) skewY(-5) skewX(2)">
    <rect x="4" y="4" width="14" height="3" rx="1.5" fill="url(#sliderGrad1)" opacity="0.25"/>
    <rect x="4" y="4.5" width="8" height="2" rx="1" fill="url(#sliderGrad1)"/>
    <circle cx="12" cy="5.5" r="2.5" fill="#2d2d2d" stroke="#26c6da" stroke-width="0.8" filter="url(#shadow)"/>

    <rect x="4" y="10" width="14" height="3" rx="1.5" fill="url(#sliderGrad2)" opacity="0.25"/>
    <rect x="4" y="10.5" width="5" height="2" rx="1" fill="url(#sliderGrad2)"/>
    <circle cx="9" cy="11.5" r="2.5" fill="#2d2d2d" stroke="#4dd0e1" stroke-width="0.8" filter="url(#shadow)"/>

    <rect x="4" y="16" width="14" height="3" rx="1.5" fill="url(#sliderGrad3)" opacity="0.25"/>
    <rect x="4" y="16.5" width="11" height="2" rx="1" fill="url(#sliderGrad3)"/>
    <circle cx="15" cy="17.5" r="2.5" fill="#2d2d2d" stroke="#80deea" stroke-width="0.8" filter="url(#shadow)"/>
  </g>
</svg>