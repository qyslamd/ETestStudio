<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 24 24" fill="none">
  <defs>
    <!-- 多色渐变背景 -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="24" y2="24">
      <stop offset="0%" stop-color="#F0F4FF"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <!-- 蓝色节点渐变 -->
    <linearGradient id="blueGrad" x1="0" y1="0" x2="12" y2="12">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <!-- 红色节点渐变 -->
    <linearGradient id="redGrad" x1="0" y1="0" x2="12" y2="12">
      <stop offset="0%" stop-color="#FB7185"/>
      <stop offset="100%" stop-color="#DC2626"/>
    </linearGradient>
    <!-- 黄色节点渐变 -->
    <linearGradient id="yellowGrad" x1="0" y1="0" x2="12" y2="12">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#EAB308"/>
    </linearGradient>
    <!-- 绿色节点渐变 -->
    <linearGradient id="greenGrad" x1="0" y1="0" x2="12" y2="12">
      <stop offset="0%" stop-color="#86EFAC"/>
      <stop offset="100%" stop-color="#22C55E"/>
    </linearGradient>
    <!-- 连接线渐变 -->
    <linearGradient id="lineGrad" x1="0" y1="0" x2="24" y2="24">
      <stop offset="0%" stop-color="#93C5FD" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#A78BFA" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FCA5A5" stop-opacity="0.8"/>
    </linearGradient>
    <!-- 阴影滤镜 -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#93C5FD" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- 圆角干净白底 -->
  <rect x="1" y="1" width="22" height="22" rx="5" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="22" height="22" rx="5" stroke="#E2E8F0" stroke-width="0.5"/>

  <!-- 等轴测网络线条（毛玻璃质感半透明） -->
  <line x1="12" y1="5" x2="5" y2="14" stroke="#A78BFA" stroke-width="1.5" stroke-opacity="0.5" stroke-linecap="round"/>
  <line x1="5" y1="14" x2="17" y2="17" stroke="#60A5FA" stroke-width="1.5" stroke-opacity="0.5" stroke-linecap="round"/>
  <line x1="12" y1="5" x2="17" y2="17" stroke="#FB7185" stroke-width="1.5" stroke-opacity="0.4" stroke-linecap="round"/>
  <line x1="12" y1="5" x2="7" y2="19" stroke="#86EFAC" stroke-width="1.2" stroke-opacity="0.4" stroke-linecap="round"/>
  <line x1="5" y1="14" x2="19" y2="11" stroke="#FCD34D" stroke-width="1.2" stroke-opacity="0.4" stroke-linecap="round"/>

  <!-- 节点（带阴影） -->
  <!-- 顶部蓝色节点 -->
  <circle cx="12" cy="5" r="3" fill="url(#blueGrad)" filter="url(#shadow)"/>
  <circle cx="11.5" cy="4.5" r="1" fill="#FFFFFF" fill-opacity="0.3"/>

  <!-- 左中红色节点 -->
  <circle cx="5" cy="14" r="3" fill="url(#redGrad)" filter="url(#shadow)"/>
  <circle cx="4.5" cy="13.5" r="1" fill="#FFFFFF" fill-opacity="0.3"/>

  <!-- 右下黄色节点 -->
  <circle cx="17" cy="17" r="3" fill="url(#yellowGrad)" filter="url(#shadow)"/>
  <circle cx="16.5" cy="16.5" r="1" fill="#FFFFFF" fill-opacity="0.3"/>

  <!-- 下方绿色节点 -->
  <circle cx="7" cy="19" r="2.2" fill="url(#greenGrad)" filter="url(#shadow)"/>
  <circle cx="6.6" cy="18.6" r="0.8" fill="#FFFFFF" fill-opacity="0.3"/>

  <!-- 右侧小节点 -->
  <circle cx="19" cy="11" r="2" fill="url(#lineGrad)" filter="url(#shadow)"/>
  <circle cx="18.6" cy="10.6" r="0.7" fill="#FFFFFF" fill-opacity="0.3"/>
</svg>
