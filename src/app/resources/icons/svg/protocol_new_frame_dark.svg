<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#1a73e8" flood-opacity="0.2"/>
    </filter>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#f8f9fa" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="docGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4fc3f7"/>
      <stop offset="50%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="plusGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e3f2fd"/>
    </linearGradient>
  </defs>
  <!-- Card background with frosted glass -->
  <rect x="1" y="1" width="22" height="22" rx="5" fill="url(#cardBg)" filter="url(#shadow)" stroke="#e0e0e0" stroke-width="0.5"/>
  <!-- Isometric document page -->
  <g transform="translate(5, 4) skewY(-6) skewX(3)">
    <rect x="0" y="0" width="14" height="16" rx="2" fill="url(#docGrad)" opacity="0.9"/>
    <!-- Lines on page -->
    <rect x="3" y="3.5" width="8" height="1" rx="0.5" fill="#ffffff" opacity="0.5"/>
    <rect x="3" y="6.5" width="6" height="1" rx="0.5" fill="#ffffff" opacity="0.5"/>
    <rect x="3" y="9.5" width="7" height="1" rx="0.5" fill="#ffffff" opacity="0.5"/>
  </g>
  <!-- + badge -->
  <circle cx="17" cy="6" r="4.5" fill="#ffffff" stroke="#2196f3" stroke-width="1.2"/>
  <path d="M17 4v4M15 6h4" stroke="#2196f3" stroke-width="1.5" stroke-linecap="round"/>
</svg>