<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#66bb6a" flood-opacity="0.3"/>
    </filter>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2d2d2d" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#1e1e1e" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="treeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#81c784"/>
      <stop offset="50%" stop-color="#66bb6a"/>
      <stop offset="100%" stop-color="#4caf50"/>
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a5d6a7"/>
      <stop offset="100%" stop-color="#66bb6a"/>
    </linearGradient>
  </defs>
  <!-- Card -->
  <rect x="1" y="1" width="22" height="22" rx="5" fill="url(#cardBg)" filter="url(#shadow)" stroke="#3c3c3c" stroke-width="0.5"/>
  <!-- Tree icon -->
  <g transform="translate(4, 3) skewY(-5) skewX(2)">
    <line x1="8" y1="2" x2="8" y2="18" stroke="url(#treeGrad)" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="8" y1="7" x2="2" y2="7" stroke="url(#treeGrad)" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="2" cy="7" r="2" fill="url(#nodeGrad)"/>
    <line x1="8" y1="11" x2="14" y2="11" stroke="url(#treeGrad)" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="14" cy="11" r="2" fill="url(#nodeGrad)"/>
    <line x1="8" y1="15" x2="4.5" y2="15" stroke="url(#treeGrad)" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="8" y1="15" x2="11.5" y2="15" stroke="url(#treeGrad)" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="4.5" cy="15" r="1.5" fill="url(#nodeGrad)" opacity="0.85"/>
    <circle cx="11.5" cy="15" r="1.5" fill="url(#nodeGrad)" opacity="0.85"/>
    <circle cx="8" cy="2" r="2" fill="url(#nodeGrad)" stroke="#ffffff" stroke-width="0.8"/>
  </g>
</svg>