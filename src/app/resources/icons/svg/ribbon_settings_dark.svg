<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <!-- Google Blue standard variant (for light theme icon) -->
    <linearGradient id="bgBlue" x1="0" y1="0" x2="256" y2="256">
      <stop offset="0%" stop-color="#5B9CF6"/>
      <stop offset="100%" stop-color="#4285F4"/>
    </linearGradient>
    <linearGradient id="gearFrost" x1="0" y1="0" x2="0" y2="256">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.10"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="224" height="224" rx="64" ry="64" fill="url(#bgBlue)"/>
  <!-- Gear body -->
  <circle cx="128" cy="128" r="38" fill="url(#gearFrost)"/>
  <!-- 6 gear teeth (rounded rects at 60 degree intervals) -->
  <g fill="url(#gearFrost)">
    <rect x="121" y="76" width="14" height="18" rx="5"/>
    <rect x="121" y="162" width="14" height="18" rx="5"/>
    <rect x="76" y="121" width="18" height="14" rx="5"/>
    <rect x="162" y="121" width="18" height="14" rx="5"/>
    <rect x="89" y="89" width="16" height="14" rx="5" transform="rotate(-60 97 96)"/>
    <rect x="151" y="89" width="16" height="14" rx="5" transform="rotate(60 159 96)"/>
    <rect x="89" y="153" width="16" height="14" rx="5" transform="rotate(60 97 160)"/>
    <rect x="151" y="153" width="16" height="14" rx="5" transform="rotate(-60 159 160)"/>
  </g>
  <!-- Gear center hole -->
  <circle cx="128" cy="128" r="18" fill="url(#bgBlue)"/>
</svg>
