<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="24" y2="24">
      <stop offset="0%" stop-color="#FF5252"/>
      <stop offset="100%" stop-color="#D50000"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#D50000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Frosted glass badge -->
  <rect x="1" y="1" width="22" height="22" rx="6" ry="6"
        fill="url(#bg)" filter="url(#shadow)" opacity="0.92"/>
  <!-- Highlight overlay (glass reflection) -->
  <rect x="1" y="1" width="22" height="22" rx="6" ry="6"
        fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="0.5"/>
  <!-- X symbol -->
  <path d="M7 7L17 17M17 7L7 17" fill="none" stroke="#FFFFFF" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
