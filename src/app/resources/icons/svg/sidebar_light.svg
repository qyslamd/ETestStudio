    <linearGradient id="blueSide" x1="0" y1="0" x2="128" y2="256">
      <stop offset="0%" stop-color="#64B5F6"/>
      <stop offset="100%" stop-color="#42A5F5"/>
    </linearGradient>
    <!-- Google Red lighter variant -->
    <linearGradient id="redSide" x1="128" y1="0" x2="256" y2="256">
      <stop offset="0%" stop-color="#EF9A9A"/>
      <stop offset="100%" stop-color="#E57373"/>
