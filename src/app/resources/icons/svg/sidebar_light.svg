    <linearGradient id="panelFrost" x1="0" y1="0" x2="0" y2="256">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.10"/>
    </linearGradient>
    <clipPath id="baseClip">
      <rect x="16" y="16" width="224" height="224" rx="64" ry="64"/>
    </clipPath>
  </defs>
