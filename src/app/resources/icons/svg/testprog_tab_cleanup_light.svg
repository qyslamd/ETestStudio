  <rect x="1" y="1" width="22" height="22" rx="5" fill="url(#cardBg)" filter="url(#shadow)" stroke="#e0e0e0" stroke-width="0.5"/>
  <g transform="translate(3, 2) skewY(-6) skewX(3)">
    <line x1="4" y1="9.5" x2="11.5" y2="2" stroke="url(#handleGrad)" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M1 9.5 L7 9.5 L8 14 L0 14 Z" fill="url(#cleanGrad)"/>
    <circle cx="9.5" cy="13.5" r="0.9" fill="#ff7043" opacity="0.55"/>
    <circle cx="11" cy="14.2" r="0.7" fill="#ff7043" opacity="0.4"/>
