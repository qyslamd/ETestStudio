<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="100" height="100">
  <defs>
    <linearGradient id="gLeft" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#1A73E8"/>
      <stop offset="50%" stop-color="#1E8E3E"/>
      <stop offset="100%" stop-color="#F9AB00"/>
    </linearGradient>
    <linearGradient id="gTop" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#F9AB00"/>
      <stop offset="100%" stop-color="#C5221F"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="groundShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <filter id="objShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.20"/>
    </filter>
  </defs>

  <!-- Ground shadow -->
  <ellipse cx="11" cy="20" rx="8.5" ry="2.5" fill="#00000012" filter="url(#groundShadow)"/>

  <!-- Document with shadow -->
  <g filter="url(#objShadow)">
    <!-- Top face (thickness) - golden → red -->
    <polygon points="4.5,5 17,9 15,11 2.5,7" fill="url(#gTop)" stroke-linejoin="round"/>
    <!-- Left face (thickness) - blue → green → golden -->
    <polygon points="4.5,5 2.5,7 2.5,17 4.5,15" fill="url(#gLeft)" stroke-linejoin="round"/>
    <!-- Front face (document body) -->
    <polygon points="4.5,5 17,9 17,19 4.5,15" fill="#ffffff" stroke="#d0d0d0" stroke-width="0.3" stroke-linejoin="round"/>
  </g>

  <!-- Content lines -->
  <g stroke-linecap="round" fill="none">
    <line x1="7.5" y1="8.5" x2="14.5" y2="10.5" stroke="#1A73E8" stroke-width="0.6"/>
    <line x1="7.5" y1="10" x2="15.5" y2="12" stroke="#1E8E3E" stroke-width="0.6"/>
    <line x1="7.5" y1="11.5" x2="12.5" y2="12.5" stroke="#F9AB00" stroke-width="0.6"/>
    <line x1="7.5" y1="13" x2="13.5" y2="14" stroke="#C5221F" stroke-width="0.6"/>
  </g>

  <!-- Glass highlight overlay -->
  <polygon points="4.5,5 17,9 13,10.5 6.5,7.5" fill="url(#glass)" stroke-linejoin="round"/>
</svg>
