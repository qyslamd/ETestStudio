<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none">
  <!-- 白色背景 -->
  <rect width="24" height="24" fill="#FFFFFF" rx="4"/>
  
  <!-- 文件外框 -->
  <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" fill="#E0E0E0" stroke="#CCCCCC" stroke-width="0.5"/>
  <path d="M14 2v6h6" fill="#D0D0D0" stroke="#CCCCCC" stroke-width="0.5"/>
  
  <!-- 文件头下方的装饰条 -->
  <rect x="4" y="12" width="16" height="10" rx="2" fill="#519ABA"/>
  
  <!-- 拓扑网络结构：中心节点连接外围节点 -->
  <line x1="7.5" y1="14.5" x2="11" y2="16.5" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="16.5" y1="14.5" x2="13" y2="16.5" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="7.5" y1="19.5" x2="11" y2="16.5" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="16.5" y1="19.5" x2="13" y2="16.5" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round"/>
  
  <!-- 外围节点间环状连接 -->
  <line x1="7.5" y1="14.5" x2="16.5" y2="19.5" stroke="#FFFFFF" stroke-width="0.8" stroke-opacity="0.6" stroke-linecap="round"/>
  <line x1="16.5" y1="14.5" x2="7.5" y2="19.5" stroke="#FFFFFF" stroke-width="0.8" stroke-opacity="0.6" stroke-linecap="round"/>
  
  <!-- 外围节点 -->
  <circle cx="7.5" cy="14.5" r="1.5" fill="#FFFFFF"/>
  <circle cx="16.5" cy="14.5" r="1.5" fill="#FFFFFF"/>
  <circle cx="7.5" cy="19.5" r="1.5" fill="#FFFFFF"/>
  <circle cx="16.5" cy="19.5" r="1.5" fill="#FFFFFF"/>
  
  <!-- 中心节点 -->
  <circle cx="12" cy="17" r="2" fill="#FFFFFF"/>
</svg>