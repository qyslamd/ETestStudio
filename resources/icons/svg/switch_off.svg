<svg xmlns="http://www.w3.org/2000/svg" width="80" height="40" viewBox="0 0 80 40">
  <!-- 背景轨道 -->
  <defs>
    <linearGradient id="offTrackGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5f5f5"/>
      <stop offset="100%" stop-color="#e0e0e0"/>
    </linearGradient>
  </defs>
  <rect x="5" y="10" width="70" height="20" rx="10" fill="url(#offTrackGrad)" stroke="#bdbdbd" stroke-width="1"/>
  <rect x="5" y="10" width="70" height="10" rx="10" ry="0" fill="#ffffff" opacity="0.3"/>
  
  <!-- 开关按钮 -->
  <defs>
    <linearGradient id="offButtonGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0f0f0"/>
    </linearGradient>
  </defs>
  <circle cx="20" cy="20" r="12" fill="url(#offButtonGrad)" stroke="#e0e0e0" stroke-width="1"/>
  <circle cx="20" cy="20" r="11" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.5"/>
  <circle cx="18" cy="18" r="3" fill="#ffffff"/>
  <circle cx="22" cy="22" r="2" fill="#e0e0e0" opacity="0.5"/>
</svg>